name: AetherOS build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate generator and generated tree
        run: |
          python -m py_compile forge_aetheros.py
          python forge_aetheros.py
          test -f AetherOS/src/kernel/kernel.cpp
          test -f AetherOS/DUNGEONS.md
          test -f AetherOS/Makefile
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm grub-pc-bin grub-common xorriso mtools gcc-multilib g++-multilib
      - name: Build bootable ISO
        run: |
          cd AetherOS
          make check
          make iso
          test -s build/AetherOS.iso
